spring:
  application:
    name: pigdi

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://archmc-cluster-mongodb.databases.svc.cluster.local:27017/?authSource=admin}
      database: ${MONGODB_DATABASE:Scala}
      # Spring Data Mongo 3+ disabled this by default. With it off, @Indexed /
      # @CompoundIndexes annotations are documentation only — Mongo won't actually
      # create the indexes. We want pigdi to ensure its indexes on startup.
      auto-index-creation: true

    # Redis Configuration
    redis:
      host: ${REDIS_HOST:archmc-cluster-redis-master.databases.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: ""
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: pigdi
  prometheus:
    metrics:
      export:
        enabled: false

# Discord OAuth
discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  redirect-uri: ${DISCORD_REDIRECT_URI:https://api.arch.mc/auth/discord/callback}

# Incentives (ad-watch flow)
incentives:
  ad-base-url: ${INCENTIVES_AD_BASE_URL:https://arch.mc/ads}
  min-confirm-interval-ms: ${INCENTIVES_MIN_CONFIRM_INTERVAL_MS:25000}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

# Logging
logging:
  level:
    root: INFO
    mc.arch.pubapi: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: DEBUG

# Sentry Error Monitoring
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: true
  debug: ${SENTRY_DEBUG:false}
  traces-sample-rate: 0.1
  exception-resolver-order: -2147483647
